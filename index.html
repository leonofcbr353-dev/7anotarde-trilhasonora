<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#050505">

    <title>Equipe África - 7 Ano T</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="app">

        <header class="header">

    <img
        src="assets/Ceará_Sporting_Club_logo.svg"
        alt="Ceará Sporting Club"
        class="ceara-logo"
    >

    <span class="eyebrow">APRESENTAÇÃO</span>

    <h1>Equipe África</h1>

    <p>7º Ano T</p>

</header>

        <section class="sound-list">

            <button class="sound-button" id="entradaButton">
                <span class="button-number">01</span>

                <span class="button-content">
                    <span class="button-title">
                        Música de Entrada
                    </span>

                    <span class="button-description">
                        Entrada / Entrega de Lembrancinhas
                    </span>
                </span>

                <span class="button-icon">↗</span>
            </button>

            <button class="sound-button" id="trilha1Button">
                <span class="button-number">02</span>

                <span class="button-content">
                    <span class="button-title">
                        Trilha Sonora 1
                    </span>

                    <span class="button-description">
                        Trilha da apresentação
                    </span>
                </span>

                <span class="button-icon">↗</span>
            </button>

            <button class="sound-button" id="trilha2Button">
                <span class="button-number">03</span>

                <span class="button-content">
                    <span class="button-title">
                        Trilha Sonora 2
                    </span>

                    <span class="button-description">
                        Trilha da apresentação
                    </span>
                </span>

                <span class="button-icon">↗</span>
            </button>

            <button class="sound-button stop-button" id="stopButton">
                <span class="button-number">04</span>

                <span class="button-content">
                    <span class="button-title">
                        Parar Som
                    </span>

                    <span class="button-description">
                        Encerrar reprodução
                    </span>
                </span>

                <span class="button-icon">×</span>
            </button>

        </section>

        <footer class="footer">
            <span>Equipe África</span>
            <span>•</span>
            <span>7º Ano T</span>
        </footer>

    </main>

    <div class="now-playing" id="nowPlaying">

    <span class="now-playing-icon">♪</span>

    <div class="now-playing-content">

        <span class="now-playing-label">
            AGORA TOCANDO
        </span>

        <span class="now-playing-title" id="nowPlayingTitle">
            —
        </span>

    </div>

</div>

    <script src="js/script.js"></script>

</body>

</html>
